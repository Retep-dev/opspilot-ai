[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot-api"
version = "0.1.0"
description = "OpsPilot AI API scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Explicit transaction nesting keeps connection and transaction boundaries visible.
ignore = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
