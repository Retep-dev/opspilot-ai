services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://opspilot:${POSTGRES_PASSWORD:-local-development-only}@db:5432/opspilot
      APP_ENV: development
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_EMBEDDING_URL: ${NVIDIA_EMBEDDING_URL:-https://integrate.api.nvidia.com/v1/embeddings}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    profiles: ["dispatch"]
    build: ./backend
    restart: on-failure
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://opspilot:${POSTGRES_PASSWORD:-local-development-only}@db:5432/opspilot
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OPSPILOT_LIVE_TEST_MODE: ${OPSPILOT_LIVE_TEST_MODE:-false}
      SLACK_TEST_CHANNEL_ID: ${SLACK_TEST_CHANNEL_ID:-}
      TEST_RECIPIENT_EMAIL: ${TEST_RECIPIENT_EMAIL:-}
    depends_on:
      backend:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
